model_name_or_path: nvidia/GLM-5.2-NVFP4
output_dir: /checkpoints/kova-smoke

dataset_config: training/configs/dataset/smoke.yaml
train_samples: 560
eval_samples: 70
dataset_seed: 42
shuffle: true
num_proc: 16

lora: true
max_steps: 110
learning_rate: 0.00002
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
model_max_length: 16384
warmup_steps: 10
lr_scheduler_type: cosine
gradient_checkpointing: true
use_liger_kernel: true
seed: 42
data_seed: 42
do_train: true
do_eval: true

save_strategy: steps
save_steps: 50
save_total_limit: 5
eval_strategy: steps
eval_steps: 50
logging_steps: 1
report_to:
  - tensorboard
