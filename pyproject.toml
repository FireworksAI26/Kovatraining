[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kova-training"
version = "0.1.0"
description = "Fail-closed controls for the KovaDev training campaign"
requires-python = ">=3.11"
dependencies = [
  "daytona==0.200.1",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.5",
]

[project.scripts]
kova-campaign = "kova_training.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kova_training"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["kova_training"]
